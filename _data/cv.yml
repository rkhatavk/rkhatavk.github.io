    Academic Research Experience:
      - company: Arizona State University, School for Engineering of Matter, Transport and Energy
        position: Graduate Research Associate
        location: Tempe, Arizona, USA
        start_date: Jan 2024
        end_date: present
        summary: "Advisors: Dr. Jiefeng Sun and Dr. Hyunglae Lee"
        highlights:
          - "Soft Tunable Passive Back Support Device: Developed a task-oriented soft passive device with tunable stiffness (0.58, 0.92, and 1.7 N/mm) and slack length (0-67 mm), combining assistance tuning with a compact passive design."
          - Demonstrated the device's efficacy in helping users regain balance after slip perturbations during standing and walking through a biomechanics study.
          - "Soft Semi-Active Back Support Device: Combined a variable-stiffness passive element with a pneumatic artificial muscle in parallel, enabling external energy addition with a compact and lightweight device."
          - Demonstrated reductions in human back-muscle effort through an electromyography study.

      - company: Indian Institute of Technology Delhi, Centre for Biomedical Engineering
        position: Research Fellow
        location: New Delhi, India
        start_date: Oct 2021
        end_date: Oct 2023
        summary: "Advisor: Dr. Deepak Joshi"
        highlights:
          - "Haptic Cueing System for Parkinson's Disease: Formulated and pilot-tested a kinematic gait parameter-driven vibrotactile cueing system for freezing-of-gait mitigation and toe-clearance enhancement."
          - The system reduced freezing severity in 8 of 10 participants with Parkinson's disease and increased toe clearance in 7 of 8 participants.
          - "Force Myography-based User Intent Detection: Developed FMG bands and decision-tree algorithms that detected step-length change intent with an F1 score of 86.64%."
          - "Cable-driven Knee Exoskeleton: Built a system for classifying people with osteoarthritis by Kellgren-Lawrence grade."
          - "Powered Ankle-Foot Prosthesis: Developed a prosthesis for assisting amputees with weight-shifting exercises during early post-amputation rehabilitation."

      - company: College of Engineering Pune
        position: Master's Thesis Researcher
        location: Pune, India
        start_date: Aug 2020
        end_date: Aug 2021
        summary: "Advisor: Dr. Ajay Bhattu"
        highlights:
          - Synthesized and optimized the fatigue life of a spring-less compliant quadruped robot leg using inherent elastodynamics and Abaqus CAE.
          - Reduced the leg assembly from five parts to two while maintaining kinematic and dynamic equivalence with a spring-loaded rigid linkage.

    Industrial Research and Development Experience:
      - company: Garrett Motion
        position: R&D Intern
        start_date: Aug 2021
        end_date: Sep 2021
        highlights:
          - Designed a torque-to-yield bolted joint to maintain joint integrity in high-pressure compressors at elevated temperatures.

      - company: American Axle and Manufacturing
        position: R&D Intern
        start_date: Aug 2017
        end_date: May 2018
        highlights:
          - Incorporated an electronic locking feature into an existing open differential while minimizing changes to the original assembly and built a functional prototype.
          - Packaged the electromagnetic actuator and locking mechanism on opposite sides of the ring gear to fit within the existing compact carrier and axle housing.
          - Used HyperMesh, Abaqus, and selective laser sintering for analysis and prototyping.
          - Developed an automatic differential locking and unlocking algorithm in MATLAB and Simulink.

      - company: College Racing Team
        position: R&D Staff
        start_date: Aug 2015
        end_date: Oct 2016
        highlights:
          - "SAE EffiCycle 2016: Designed a chain-and-cassette transmission, reduction gearbox, and differential gearbox; calculated drivetrain performance; and supported CAD, assembly, and GD&T drafting."
          - "SAE Supra 2016: Designed the engine intake manifold and simulated airflow through a venturi and orifice using Abaqus CAE."

